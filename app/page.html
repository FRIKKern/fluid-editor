<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How Fluid Engine works</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;1,400&display=swap">
<link rel="stylesheet" href="src/site.css">
</head>
<body>
<!-- The published page: our renderer's HTML and CSS, no editor. Gate B measures this. -->
<div id="header-slot"></div>
<main id="page"></main>
<script type="module">
import { renderPage, renderHeader, renderFooter, HEADER_SCRIPT, ACCORDION_SCRIPT, VIDEO_SCRIPT, SHAPE_SCRIPT } from './src/render.js';
import { demoModel } from './src/demo.js';
import { IMAGE_EFFECT_SCRIPT } from './src/image-effects.js';
import { siteStylesHead } from './src/site-style-packs.js';
// ?page=home renders another imported trial-site page (app/src/pages/home.js).
const slug = new URLSearchParams(location.search).get('page');
// ?saved renders the model the editor last saved in this browser (Exit opens it).
const saved = (() => { if (!new URLSearchParams(location.search).has('saved')) return null; try { return JSON.parse(localStorage.getItem('fluid-editor:model:v2')); } catch { return null; } })();
const model = saved || (slug ? { header: demoModel().header, ...(await import(`./src/pages/${slug}.js`)).PAGE } : demoModel());
document.head.insertAdjacentHTML('beforeend', siteStylesHead(model.siteStyles));
document.getElementById('header-slot').outerHTML = renderHeader(model.header);
document.getElementById('page').innerHTML = renderPage(model);
document.getElementById('page').insertAdjacentHTML('afterend', renderFooter(model));
new Function(HEADER_SCRIPT)();
new Function(ACCORDION_SCRIPT)();
new Function(VIDEO_SCRIPT)();
new Function(SHAPE_SCRIPT)();
new Function(IMAGE_EFFECT_SCRIPT)();
document.documentElement.dataset.rendered = 'true';
</script>
</body>
</html>
