<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fluid editor prototype</title>
<link rel="stylesheet" href="src/editor-shell.css">
</head>
<body>
<header class="bar">
  <div class="bar-left">
    <button id="save" class="btn primary" disabled>Save</button>
    <button id="exit" class="btn">Exit</button>
    <button id="undo" class="icon" title="Undo (Cmd+Z)" disabled>&#8630;</button>
    <button id="redo" class="icon" title="Redo (Shift+Cmd+Z)" disabled>&#8631;</button>
  </div>
  <div class="bar-center">
    <div class="page-name">How Fluid Engine works</div>
    <div class="page-state" id="page-state">Page · Published</div>
  </div>
  <div class="bar-right">
    <div class="seg" role="group" aria-label="Device">
      <button id="bp-desktop" class="seg-btn is-on" title="Desktop layout">Desktop</button>
      <button id="bp-mobile" class="seg-btn" title="Phone layout">Phone</button>
    </div>
    <button id="export" class="btn">Export HTML</button>
    <button id="reset" class="btn">Reset demo</button>
  </div>
</header>
<div class="work">
  <div class="stage" id="stage">
    <iframe id="site-frame" src="site.html" title="Page canvas"></iframe>
    <div class="section-chrome" id="section-chrome" hidden></div>
    <div class="block-toolbar" id="block-toolbar" role="toolbar" aria-label="Block" hidden></div>
    <div class="section-panel" id="section-panel" role="dialog" aria-label="Edit Section" hidden></div>
    <div class="sc-menu" id="add-block-menu" hidden></div>
  </div>
  <aside class="panel" id="panel" aria-live="polite"></aside>
</div>
<div class="exit-dialog" id="exit-dialog" role="dialog" aria-labelledby="exit-title" hidden>
  <p class="exit-title" id="exit-title">Exit Without Saving?</p>
  <p>Any unsaved changes will be discarded when you exit.</p>
  <div class="row"><button class="btn" id="exit-save">Save</button><button class="btn danger" id="exit-discard">Exit</button></div>
</div>
<script type="module" src="src/editor.js"></script>
</body>
</html>
