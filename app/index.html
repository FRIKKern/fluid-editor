<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fluid editor prototype</title>
<link rel="stylesheet" href="src/editor-shell.css">
</head>
<body>
<header class="bar">
  <!-- Laid out like the oracle's top bar: Save, Exit, Undo and Redo on the left, the page in
       the middle, the device toggle, Site Styles and Preview on the right. Our own tools sit in
       a developer menu (data-dev) the inventory ignores. -->
  <div class="bar-left">
    <button id="save" class="tb-save" disabled>Save</button>
    <button id="exit" class="tb-exit">Exit</button>
    <button id="undo" class="tb-icon" aria-label="Undo" title="Undo (Cmd+Z)" disabled><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
    <button id="redo" class="tb-icon" aria-label="Redo" title="Redo (Shift+Cmd+Z)" disabled><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
  </div>
  <div class="bar-center">
    <div class="page-name">How Fluid Engine works</div>
    <div class="page-state" id="page-state">Page · Published</div>
  </div>
  <div class="bar-right">
    <div class="tb-seg" role="radiogroup" aria-label="Device">
      <button id="bp-desktop" class="tb-seg-btn is-on" role="radio" aria-checked="true" aria-label="Desktop View" title="Desktop layout"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="1"/><path d="M8 20h8M12 16v4"/></svg></button>
      <button id="bp-mobile" class="tb-seg-btn" role="radio" aria-checked="false" aria-label="Mobile View" title="Phone layout"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 18h2"/></svg></button>
    </div>
    <button class="tb-icon" aria-label="Toggle Site Styles editing" title="Site Styles (not built yet)" data-unbuilt><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4l6 6-8 8-6-6z"/><path d="M6 12l-2 6 6-2"/><path d="M9 7l8 8"/></svg></button>
    <button id="preview" class="tb-icon" aria-label="Toggle preview mode" aria-pressed="false" title="Preview"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4l12 8-12 8z"/></svg></button>
    <div class="dev-menu" data-dev>
      <button id="dev-toggle" class="tb-icon" aria-label="Developer tools" title="Developer tools"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="12" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/><circle cx="18" cy="12" r="1.3" fill="currentColor"/></svg></button>
      <div class="dev-pop" id="dev-pop" hidden>
        <button id="inspector-toggle" class="btn" aria-pressed="false">Show inspector</button>
        <button id="export" class="btn">Export HTML</button>
        <button id="reset" class="btn">Reset demo</button>
      </div>
    </div>
  </div>
</header>
<div class="work">
  <div class="stage" id="stage">
    <iframe id="site-frame" src="site.html" title="Page canvas"></iframe>
    <div class="phone-lines" id="phone-lines" aria-hidden="true"></div>
    <div class="section-chrome" id="section-chrome" hidden></div>
    <div class="block-toolbar" id="block-toolbar" role="toolbar" aria-label="Block" hidden></div>
    <div class="text-bar" id="text-bar" role="toolbar" aria-label="Text" hidden></div>
    <div class="section-panel" id="section-panel" role="dialog" aria-label="Edit Section" hidden></div>
    <div class="section-panel block-panel" id="block-panel" role="dialog" aria-label="Edit block" hidden></div>
    <div class="link-popover" id="link-popover" role="dialog" aria-label="Link editor" hidden></div>
    <div class="am-panel" id="add-block-menu" role="dialog" aria-label="Add Block" hidden></div>
    <div class="lp-panel" id="layers-panel" role="dialog" aria-label="Layers" hidden></div>
    <div class="cm-menu" id="context-menu" role="menu" aria-label="Block actions" hidden></div>
  </div>
  <aside class="panel" id="panel" aria-live="polite"></aside>
</div>
<div class="exit-dialog" id="exit-dialog" role="dialog" aria-labelledby="exit-title" hidden>
  <p class="exit-title" id="exit-title">Exit Without Saving?</p>
  <p>Any unsaved changes will be discarded when you exit.</p>
  <div class="row"><button class="btn" id="exit-save">Save</button><button class="btn danger" id="exit-discard">Exit</button></div>
</div>
<script type="module" src="src/editor.js"></script>
</body>
</html>
