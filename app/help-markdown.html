<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markdown</title>
<style>body { max-width: 560px; margin: 48px auto; padding: 0 16px; font: 16px/1.5 system-ui, sans-serif; background: #fff; color: #111; } code { font-size: 14px; }</style>
</head>
<body>
<h1>Markdown</h1>
<ul>
<li><code># Heading</code>, up to six #</li>
<li><code>**bold**</code> and <code>*italic*</code></li>
<li><code>[words](/page)</code> for a link</li>
<li><code>* item</code> for a list, <code>1. item</code> for a numbered one</li>
<li><code>&gt; words</code> for a quote</li>
<li>A blank line starts a new paragraph</li>
</ul>
</body>
</html>
