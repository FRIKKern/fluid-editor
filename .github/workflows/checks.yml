# Gate A, item rules and doc rules on every push and pull request (QUALITY.md).
name: checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Full history: check-claims looks for each claimed count in parity/<x>-check.json on main, and fails in CI without it.
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm run check
