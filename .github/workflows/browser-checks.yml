# The headless browser checks on a Linux runner, one job per check, after every push to main and on demand.
# Phase 1: it reports only. No pull_request trigger and no required check, so it never blocks a PR.
# Each job serves app/, starts its own headless Chrome (scripts/lib/chrome.mjs) and runs one check. The job's
# summary has the check's pass count here and in main's stored result file; a red job uploads its log and result.
# Run a few by hand: gh workflow run browser-checks --ref <branch> -f checks=text-check,mid-check
name: browser-checks
on:
  push:
    branches: [main, ci-browser-checks] # TEMP: measuring before merge, dispatch needs the file on main
  workflow_dispatch:
    inputs:
      checks:
        description: 'Comma list of checks to run (blank: all)'
        required: false
        default: ''
permissions:
  contents: read
# One run at a time per branch; a newer push waits, and replaces any run still waiting.
concurrency:
  group: browser-checks-${{ github.ref }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      # name, extra args, job time limit in minutes. Longest first, so they start first.
      - id: pick
        env: { ONLY: '${{ inputs.checks }}' }
        run: |
          node -e '
          const all = [
            ["neworder-check", "--full", 60], ["marks-check", "", 45], ["textpush-check", "", 45],
            ["code-check", "--full", 40], ["mid-check", "", 40], ["row-check", "--full", 30],
            ["text-check", "--full", 30], ["x6-check", "", 30], ["form-check", "", 30],
            ["dialog-check", "", 30], ["anim-check", "", 30], ["standin-check", "", 30],
            ["t11-check", "", 30], ["block-design-check", "", 30], ["video-check", "", 30],
            ["shape-check", "", 30], ["snap-check", "", 30], ["paste-check", "--full", 20],
            ["chrome-check", "", 20], ["section-check", "", 20], ["design-edit-check", "", 20],
            ["accordion-check", "", 20], ["accordion-styles-check", "", 20], ["scrolling-check", "", 20],
            ["tiles-check", "", 20], ["fold-check", "", 20], ["rows-fit-check", "", 20],
            ["resize-check", "", 20], ["image-check", "", 20], ["image-design-check", "", 20],
            ["image-effect-check", "", 20], ["image-editor-check", "", 20], ["image-import-check", "", 20],
            ["image-shape-check", "", 20], ["site-styles-check", "", 20], ["button-check", "", 20],
            ["menu-check", "", 20], ["near-check", "", 20], ["autoscroll-check", "", 20], ["coverage-check", "", 20],
          ];
          const only = process.env.ONLY.split(",").map((s) => s.trim()).filter(Boolean);
          const unknown = only.filter((n) => !all.some(([c]) => c === n));
          if (unknown.length) { console.error(`not in the list: ${unknown.join(", ")}`); process.exit(1); }
          const include = all.filter(([c]) => !only.length || only.includes(c)).map(([check, args, minutes]) => ({ check, args, minutes }));
          require("fs").appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({ include })}\n`);
          console.log(include.map((c) => c.check).join(" "));
          '
  check:
    needs: plan
    name: ${{ matrix.check }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.minutes }}
    strategy:
      fail-fast: false
      # The account's runners are shared with other repos' PR checks: leave most of them free.
      max-parallel: 8
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      FLUID_PORT: 5178
      CDP_PORT: 9333
      FLUID_SURFACE: cdp:9333
      TMPDIR: /tmp/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      # The Mac lanes run Chrome 157; the same major here.
      - id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with: { chrome-version: 157, install-dependencies: true }
      - name: Fonts and Chrome
        env: { CHROME_BIN: '${{ steps.chrome.outputs.chrome-path }}' }
        run: |
          # The runner's user namespaces are locked down (AppArmor), so Chrome's sandbox can't start: a throwaway VM runs without it.
          printf '#!/bin/sh\nexec "%s" --no-sandbox "$@"\n' "$CHROME_BIN" > "$RUNNER_TEMP/chrome"
          chmod +x "$RUNNER_TEMP/chrome"
          echo "CHROME=$RUNNER_TEMP/chrome" >> "$GITHUB_ENV"
          "$CHROME_BIN" --version
          for f in 'Helvetica Neue' Helvetica Arial sans-serif monospace Menlo; do echo "$f -> $(fc-match "$f")"; done
      - name: Run ${{ matrix.check }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          node scripts/serve.mjs > "$RUNNER_TEMP/out/serve.log" 2>&1 &
          for i in $(seq 50); do curl -fs "http://127.0.0.1:$FLUID_PORT/" > /dev/null && break; sleep 0.2; done
          node scripts/headless.mjs
          set -o pipefail
          start=$(date +%s)
          npm run ${{ matrix.check }} ${{ matrix.args && format('-- {0}', matrix.args) }} 2>&1 | tee "$RUNNER_TEMP/out/${{ matrix.check }}.log"
          code=$?
          echo "took $(( $(date +%s) - start )) s"
          exit $code
      - name: Count against main
        if: always()
        run: |
          node -e '
          const { execFileSync } = require("child_process"); const fs = require("fs");
          const file = `parity/${process.argv[1]}.json`;
          const count = (j) => j && Number.isFinite(j.pass) ? `${j.pass}/${j.total}` : "no count";
          let ci = null, mac = null;
          try { ci = JSON.parse(fs.readFileSync(file, "utf8")); } catch {}
          try { mac = JSON.parse(execFileSync("git", ["show", `HEAD:${file}`], { encoding: "utf8", stdio: ["ignore", "pipe", "ignore"] })); } catch {}
          const changed = ci && mac && JSON.stringify(ci) !== JSON.stringify(mac);
          const line = `| ${process.argv[1]} | ${count(ci)} | ${count(mac)} | ${ci ? (changed ? "result file differs" : "same file") : "no result file"} |`;
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `| check | CI | stored (Mac) | |\n|---|---|---|---|\n${line}\n`);
          console.log(line);
          ' ${{ matrix.check }}
          cp parity/${{ matrix.check }}.json "$RUNNER_TEMP/out/" 2>/dev/null || true
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.check }}
          path: ${{ runner.temp }}/out/
          retention-days: 14
