# Keeps the README timeline, the roadmap picture and the parity picture current.
# Why and how: docs/decisions/0003-tracking.md
name: housekeeping
on:
  push:
    branches: [main]
  issues:
    types: [closed, reopened, labeled, unlabeled, edited]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: read
concurrency:
  group: housekeeping
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      # Each try starts from origin/main as it is now, regenerates and pushes.
      # A push rejected because main moved starts over, at most 3 times.
      - name: Regenerate and push
        env: { GITHUB_TOKEN: '${{ github.token }}' }
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for try in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            node scripts/readme-timeline.mjs
            node scripts/generate-roadmap.mjs
            node scripts/generate-parity.mjs
            node scripts/check-docs.mjs
            git add README.md docs/images/roadmap.svg docs/images/parity.svg docs/PARITY.md
            git diff --cached --quiet && { echo "no change"; exit 0; }
            git commit -q -m 'chore: refresh README timeline, roadmap and parity [skip ci]'
            git push origin HEAD:main && exit 0
            echo "::warning::push $try rejected (main moved): regenerating from origin/main"
            sleep $((try * 5))
          done
          echo "::error::main kept moving; 3 pushes rejected"
          exit 1
